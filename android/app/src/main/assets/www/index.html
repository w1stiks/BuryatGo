<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light only">
  <title>BuryatGo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BuryatGo">
  <meta name="format-detection" content="telephone=no">
</head>
<body>
  <div id="app">
    <div id="splash" class="splash">
      <div class="splash-logo">👋</div>
      <div class="splash-title">BuryatGo</div>
      <div class="splash-sub">Амар мэндэ!</div>
    </div>
    <header id="topbar" class="topbar"></header>
    <main id="screen" class="screen"></main>
    <nav id="tabbar" class="tabbar">
      <button class="tab" data-tab="home"><span class="tab-ic">🗺️</span><span class="tab-lb">Карта</span></button>
      <button class="tab" data-tab="shop"><span class="tab-ic">👘</span><span class="tab-lb">Магазин</span></button>
      <button class="tab" data-tab="profile"><span class="tab-ic">👤</span><span class="tab-lb">Профиль</span></button>
      <button class="tab" data-tab="leagues"><span class="tab-ic">🏆</span><span class="tab-lb">Лиги</span></button>
    </nav>
    <div id="overlay" class="overlay"></div>
    <div id="toast" class="toast"></div>
    <canvas id="confetti" class="confetti"></canvas>
  </div>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cloud-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
